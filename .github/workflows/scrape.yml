name: Daily scrape

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "scraper[dev]"

      - name: Run scraper tests
        run: python -m pytest scraper/tests -q

      - name: Run scraper
        run: python -m scraper

      - name: Validate data against schema contract
        run: |
          python - <<'PY'
          import json
          import pathlib

          from jsonschema import Draft7Validator, FormatChecker

          schema = json.loads(pathlib.Path("specs/contracts/prices.schema.json").read_text(encoding="utf-8"))
          data = json.loads(pathlib.Path("data/prices.json").read_text(encoding="utf-8"))
          Draft7Validator(schema, format_checker=FormatChecker()).validate(data)
          print(f"schema OK: {len(data['prices'])} prices, updatedAt={data['updatedAt']}")
          PY

      - name: Commit new prices
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No price changes since last snapshot; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "chore: daily prices"
          git push
